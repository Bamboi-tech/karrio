domains:
  app: karrio-app.bamboi.eu
  api: karrio-api.bamboi.eu
letsencrypt_email: tools@bamboi.eu

# Custom image tag from the "Build Karrio Images" workflow (e.g. 2026.1.31-ab12cd3).
# Keep staging and production on the SAME tag. Empty = deploy fails fast with a hint.
karrio_tag: "2026.1.31-daf16fc"
karrio_server_image: europe-north2-docker.pkg.dev/bamboi-tech/bamboi-karrio/karrio-server
karrio_dashboard_image: europe-north2-docker.pkg.dev/bamboi-tech/bamboi-karrio/karrio-dashboard
caddy_image: caddy:2.8.4
postgres_image: postgres:16
redis_image: redis:7
pull_policy: if_not_present

# Database (non-secret parts; password lives in vault/env/production.yaml)
database_name: karrio
database_username: karrio

# Sentry error monitoring. DSNs are not secrets (the dashboard one ships to
# every browser anyway). Backend project: karrio Django API + worker.
sentry_dsn: "https://036416afe6ba07c6a64b6df9e7801b90@o4511905404354560.ingest.de.sentry.io/4511905420214352"
# Dashboard (Next.js) Sentry project DSN — create a separate Next.js project
# in the same Sentry org and paste its DSN here; empty = client Sentry off.
sentry_dashboard_dsn: ""

# Email via Mailgun EU (credential lives in vault/env/production.yaml)
email_host: smtp.eu.mailgun.org
email_port: "587"
email_use_tls: "True"
email_from_address: noreply@bamboi.eu

# ERP label gate (Ship Today phase 2). The token is the ERPNext "Karrio
# Dashboard" integration user's api_key:api_secret and lives in
# vault/env/production.yaml as erp_gate_token. Empty token = purchases on
# ERP-linked shipments fail closed with a clear message.
erp_gate_url: "https://erp.bamboi.eu"
